(function(){

    /* Lisibilité sur fond sombre : une teinte trop foncée est éclaircie jusqu'à un contraste d'au moins 4,5:1. */
    while(lum(r,g,b)<.21&&k<30){r+=(255-r)*.12;g+=(255-g)*.12;b+=(255-b)*.12;k++}

    st.setProperty('--acc-soft-2','rgba('+rgb+',.26)');
    st.setProperty('--acc-line','rgba('+rgb+',.62)');
    st.setProperty('--acc-glow','0 6px 20px rgba('+rgb+',.38)');

  };

  /* Photo d'arrière-plan choisie par l'utilisateur (enregistrée sur cet appareil). Sans photo : img/fond.jpg. */
  window.applyBgImage=function(data){

/* Écran de connexion : un haltère dessiné par des traits qui s'assemblent, s'écartent sous le doigt et éclatent au toucher. */
(function(){

      return {tx:p.x,ty:p.y,x:still?p.x:W/2+Math.cos(a)*r,y:still?p.y:H/2+Math.sin(a)*r,vx:0,vy:0,

    });

    if(running||root.style.display==='none')return;

  --bg:#0B0D11;--bg-grad:linear-gradient(180deg,#171C23 0%,#0F1217 40%,#0B0D11 80%);
  --surface:#171B21;--raised:#1F242C;--ink:#F5F7FA;--ink2:#DCE5EE;--muted:#98A4B3;--line:#2A313B;--slate:#5C6B7C;
  --fill:rgba(170,186,201,.13);--glass:rgba(30,35,43,.62);--glass-b:rgba(255,255,255,.08);--shadow:none;
  --accent:#F5F7FA;--accent-ink:#111318;--accent-soft:#2A313B;
  --done:#3CC48A;--done-ink:#05210F;--done-soft:#14301F;--pr:#F0BC2E;--danger:#F06A5F;--danger-ink:#1E0805;color-scheme:dark}

body{background:var(--bg) var(--bg-grad) no-repeat fixed;font:16px/1.4 var(--body);letter-spacing:-.008em;-webkit-font-smoothing:antialiased;color:var(--ink)}
main{padding-block:4px 28px}
#view>*,.top{width:100%;max-width:980px;margin-inline:auto}
.stack{gap:16px}

/* Typo : plus de majuscules condensées */
.brand,.h,.prog h3,.work-head input,.empty h2,.hs-head .hn,.sh,.day .dn,.dnav .dcur b,.streak .t,.rcard .lvl,.rmini b,.bestl b,.vh b,.lift .lh b,
.srow.head,.grp-h,.rec span,.stat span,.macro span,.rest-in #rl,.hs-head .hd,.brow .hd,.date{text-transform:none;letter-spacing:-.015em}
.h{font:600 21px/1.2 var(--display);color:var(--ink);margin-top:14px;letter-spacing:-.02em}
.h3{font:600 17px/1.25 var(--display);margin:6px 0 0}
.sub,.hint{color:var(--muted);font-size:15px}
.grp-h{font:600 13px/1.2 var(--body);color:var(--muted);margin-top:14px}
.empty h2,.sh{font:600 28px/1.15 var(--display);letter-spacing:-.03em}
.prog h3,.ex-head h3,.hs-head .hn,.day .dn,.dnav .dcur b,.streak .t,.vh b,.lift .lh b,.rcard .lvl,.rmini b,.bestl b{font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.ex-head h3{font-size:18px}.hs-head .hn,.day .dn,.dnav .dcur b{font-size:18px}
.rec b,.stat b,.macro b,.fk,.streak .big{font-family:var(--display);font-weight:600;letter-spacing:-.03em}

/* En-tête */
.top{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:6px;min-height:64px}
.brand{font:600 32px/1.1 var(--display);letter-spacing:-.035em;flex:1;min-width:0}
.greet{flex:1;min-width:0}
.greet p{font:300 26px/1.15 var(--display);letter-spacing:-.03em}
.greet p b{font-weight:700}
.greet span{display:block;color:var(--muted);font-size:14px;margin-top:3px;text-transform:capitalize}
.prof{min-height:44px;gap:0}
.prof .pn{display:none}
.prof .av{width:46px;height:46px;border:0;background:var(--glass);color:var(--ink);box-shadow:var(--shadow),inset 0 0 0 1px var(--glass-b);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.backb{width:44px;height:44px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-b);color:var(--ink)}
.backb svg,.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Cartes */
.prog,.ex,.hs,.chart,.rec,.brow,.day,.fcard,.frow,.streak,.rcard,.rmini,.qrow,.tierrow,.mpd,.bestl,.tro,.vrow,.bwbox,.lift,.card{
  background:var(--surface);border:0;border-radius:24px;box-shadow:var(--shadow)}
.card{padding:18px;display:flex;flex-direction:column;gap:12px}
.prog,.fcard,.lift,.bwbox,.streak{padding:18px}
.stat{border:0;border-radius:18px;background:var(--fill)}
.day.today{background:var(--accent-soft)}
.tierrow.cur{box-shadow:0 0 0 2px var(--ink)}
.tro.done{box-shadow:0 0 0 2px var(--pr)}
.banner{border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.banner .mini{white-space:nowrap;flex:none}
.chart{padding:16px 10px 8px}
.chart .val{fill:var(--ink);font:600 13px var(--display)}
.chart text{fill:var(--muted);font:500 11px var(--body)}
.hs-body{border-top-color:var(--line)}

/* Boutons */
.btn{min-height:52px;border-radius:999px;border:0;font-size:16px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--ease),opacity .18s,background .2s}
.btn.big{min-height:60px;font-size:17px}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn:active,.pill:active,.mini:active,.chk:active,.icon-btn:active,.pcard:active,.mcard:active,.excard:active,.tile:active,.wday:active{transform:scale(.97)}
.btn:disabled,.pill:disabled{opacity:.35;cursor:default;transform:none}
.link{color:var(--ink2);text-decoration:none;font-weight:500}
.link.center{align-self:center}
.mini{border:0;background:var(--fill);border-radius:999px;font-weight:600;color:var(--ink);min-height:38px;padding:0 14px}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--ease),opacity .18s}
.pill.light{background:#F5F7FA;color:#111318}
.pill.dark{background:#111318;color:#fff}
.pill.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill.sm{min-height:36px;padding:0 14px;font-size:14px}
.glass,.pill.glass{background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;color:inherit;padding:0}
.icon-btn .ico{width:18px;height:18px}
.glass-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:#fff;white-space:nowrap;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.glass-chip .ico,.glass-chip svg{width:14px;height:14px;flex:none}

/* Champs */
.field,.srow input,.tf input{border:0;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.field:focus,.srow input:focus,.tf input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.lab{color:var(--muted);font-size:13px;font-weight:500}
.seg{background:var(--fill);border-radius:999px;padding:4px;gap:4px}
.seg button,.metric button{border:0;background:transparent;border-radius:999px;min-height:38px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"],.metric button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,19,24,.1),0 4px 12px rgba(17,19,24,.05)}
.metric{background:var(--fill);border-radius:999px;padding:4px;gap:4px}
.chip{border:0;background:var(--fill)}
.lootb{border-width:2px;border-radius:16px;background:var(--fill)}
.sumbtn{border:0;background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}
.tdots i{border:0;background:var(--fill)}
.fbar,.gauge{background:var(--fill)}
.fbar i{background:var(--ink)}
.pick{border-bottom-color:var(--line);font-size:16px}
.shrow,.favrow,.wrow,.sp-row,.trow{border-bottom-color:var(--line)}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none;height:100%}

/* Puces de filtre défilantes */
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px;scroll-padding-inline:16px}
.fchips::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.exstrip::-webkit-scrollbar,.wstrip::-webkit-scrollbar{display:none}
.fchip{flex:none;height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-b);color:var(--ink2);font-weight:500;font-size:14px;scroll-snap-align:start;transition:background .2s,color .2s}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}

/* Illustrations / photos */
.ph{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,rgba(220,229,238,.28),transparent 55%),linear-gradient(155deg,#56616F 0%,#343B45 45%,#111318 100%)}
.ph[data-k="dos"]{background:radial-gradient(120% 90% at 15% 0%,rgba(220,229,238,.26),transparent 55%),linear-gradient(200deg,#4C5A6B 0%,#2E3540 50%,#111318 100%)}
.ph[data-k="epaules"]{background:radial-gradient(110% 80% at 70% 10%,rgba(170,186,201,.35),transparent 55%),linear-gradient(160deg,#5D6979 0%,#3A424D 50%,#15181E 100%)}
.ph[data-k="bras"]{background:radial-gradient(120% 90% at 90% 20%,rgba(220,229,238,.22),transparent 55%),linear-gradient(140deg,#4A5768 0%,#323944 50%,#111318 100%)}
.ph[data-k="jambes"]{background:radial-gradient(120% 90% at 20% 10%,rgba(170,186,201,.3),transparent 55%),linear-gradient(170deg,#3F4956 0%,#262C35 55%,#0D0F13 100%)}
.ph[data-k="abdos"]{background:radial-gradient(120% 90% at 60% 0%,rgba(220,229,238,.3),transparent 50%),linear-gradient(150deg,#606C7B 0%,#3A424D 50%,#16191F 100%)}
.ph[data-k="fullbody"],.ph[data-k="accueil"]{background:radial-gradient(130% 90% at 80% 0%,rgba(220,229,238,.32),transparent 55%),linear-gradient(165deg,#647183 0%,#3B4450 45%,#111318 100%)}
.ph .glyph{position:absolute;right:-8%;bottom:-14%;width:78%;max-width:360px;height:auto;fill:none;stroke:rgba(245,247,250,.13);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.55) contrast(1.05)}
.ph.fill{position:absolute;inset:0;z-index:0}
.ph.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,19,24,.05) 0%,rgba(17,19,24,.15) 45%,rgba(17,19,24,.78) 100%)}
.ph.thumb{width:64px;height:64px;border-radius:16px;flex:none}
.ph.thumb .glyph{width:120%;right:-25%;bottom:-25%;stroke:rgba(245,247,250,.22)}

/* Accueil : semaine */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border:0;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-b);color:var(--ink2);transition:background .25s var(--ease),color .25s,transform .18s}
.wday span{font-size:12px;font-weight:500;text-transform:capitalize}
.wday b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font:600 14px var(--display);color:var(--ink)}
.wday i{width:5px;height:5px;border-radius:50%;background:transparent}
.wday i.plan{background:var(--slate)}
.wday i.done{background:var(--done)}
.wday.today span{font-weight:700;color:var(--ink)}
.wday.on{background:var(--ink);color:var(--surface);box-shadow:0 8px 20px rgba(17,19,24,.25)}
.wday.on span{color:var(--surface)}
.wday.on b{background:rgba(255,255,255,.14);color:#fff}
:root[data-theme="dark"] .wday.on b{background:rgba(17,19,24,.1);color:#111318}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.sec-h .h{margin:0}

/* Accueil : carte héros */
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:300px;color:#fff;box-shadow:0 18px 40px rgba(17,19,24,.18);isolation:isolate}
.hero-in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:300px;padding:18px}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hero h2{font:600 30px/1.1 var(--display);letter-spacing:-.035em;margin:4px 0 12px;max-width:16ch}
.hero .kick{font-size:15px;color:rgba(255,255,255,.82)}
.pc-meta{display:flex;gap:8px;flex-wrap:wrap}
.hero-cta{display:flex;gap:8px;align-items:stretch}
.slide{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:60px;padding:6px 18px 6px 6px;border:0;border-radius:999px;background:rgba(245,247,250,.92);color:#111318;font-weight:600;font-size:16px;text-align:left;transition:transform .18s var(--ease)}
.slide .knob{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:#111318;color:#fff;transition:transform .35s var(--ease)}
.slide:hover .knob{transform:translateX(4px)}
.slide:active{transform:scale(.98)}
.hero-cta .pill{height:60px;min-height:60px}
.hero.hero-rest .hero-in{justify-content:space-between}

/* Tuiles de statistiques */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:22px;border:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-b),var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--ink);text-align:left;min-width:0;transition:transform .18s var(--ease)}
.tile .ico{width:18px;height:18px;color:var(--muted)}
.tile b{font:600 22px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile b small{font:500 13px var(--body);color:var(--muted);letter-spacing:0}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.25}
.tiles.two{grid-template-columns:1fr 1fr}

/* Carrousel de programmes */
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 10px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.mcard{position:relative;flex:none;width:190px;height:230px;border-radius:26px;overflow:hidden;border:0;padding:0;color:#fff;text-align:left;scroll-snap-align:start;box-shadow:var(--shadow);isolation:isolate;transition:transform .18s var(--ease)}
.mc-in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:12px}
.mc-b b{display:block;font:600 19px/1.15 var(--display);letter-spacing:-.025em}
.mc-b small{font-size:13px;color:rgba(255,255,255,.8)}
.mcard.new{background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--slate);color:var(--ink);display:grid;place-items:center;text-align:center;font-weight:600}
.mcard.new .ico{width:28px;height:28px;margin:0 auto 8px}

/* Cartes de programme */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.pcard{position:relative;border-radius:30px;overflow:hidden;min-height:270px;color:#fff;box-shadow:var(--shadow);isolation:isolate;transition:transform .18s var(--ease)}
.pc-in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:14px;height:100%;min-height:270px;padding:16px}
.pc-g{font-size:13px;color:rgba(255,255,255,.78);font-weight:500}
.pcard h3{font:600 26px/1.1 var(--display);letter-spacing:-.035em;margin:2px 0 10px}
.pc-act{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:nowrap;min-width:0}
.pc-act .pill{padding:0 16px;flex:none}
.pc-act .sp{flex:1}

/* Bibliothèque d'exercices */
.exgrid{display:grid;grid-template-columns:1fr;gap:10px}
.excard{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink);min-width:0;transition:transform .18s var(--ease)}
.excard .exc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.excard b{font-weight:600;font-size:16px;letter-spacing:-.015em}
.excard small{color:var(--muted);font-size:13px}
.excard .rx{font-size:12px;font-weight:600;color:var(--ink2);background:var(--fill);border-radius:999px;padding:3px 9px;align-self:flex-start;margin-top:3px}
.excard .chev{color:var(--slate)}

/* Fiches (feuilles du bas) */
.scrim{background:rgba(17,19,24,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-body{border:0;border-radius:30px 30px 0 0;background:var(--surface);padding-top:10px;box-shadow:0 -12px 40px rgba(17,19,24,.18);max-width:620px}
.sheet-body::before{content:"";align-self:center;flex:none;width:38px;height:5px;border-radius:3px;background:var(--line);margin-bottom:4px}
.sheet-h{position:relative;border-radius:24px;overflow:hidden;min-height:170px;color:#fff;display:flex;align-items:flex-end;isolation:isolate}
.sheet-h .t{position:relative;z-index:1;padding:16px}
.sheet-h h2{font:600 26px/1.1 var(--display);letter-spacing:-.03em}
.rx3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rx3>div{background:var(--raised);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.rx3 span{font-size:12px;color:var(--muted)}
.rx3 b{font:600 17px/1.2 var(--display);letter-spacing:-.02em}
.lead{font-size:16px;line-height:1.5;color:var(--ink2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.cues{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:10px}
.cues li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.45}
.cues li::before{content:counter(c);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:600 13px var(--display)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag2{height:28px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.lrow .ph.thumb{width:48px;height:48px;border-radius:14px}
.lrow>span:not(.ph){flex:1;min-width:0;display:flex;flex-direction:column}
.lrow b{font-weight:600}
.lrow small{color:var(--muted);font-size:13px}
.lrow .sr{flex:none;font:600 15px var(--display);color:var(--ink2);font-variant-numeric:tabular-nums}

/* Entraînement : liste de lancement */
.lcard{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.lcard>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lcard b{font-weight:600;font-size:16px}
.lcard small{color:var(--muted);font-size:13px}

/* Entraînement : séance en cours */
.wtop{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:26px;background:var(--ink);color:var(--surface)}
.wtop-r{display:flex;align-items:center;gap:12px}
.wtop input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;color:inherit;font:600 22px/1.2 var(--display);letter-spacing:-.025em;padding:2px 0}
.wtop input:focus{outline:none;border-bottom-color:rgba(255,255,255,.4)}
.wtop .clock{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums;color:inherit;opacity:.9}
.wprog{display:flex;align-items:center;gap:12px;font-size:13px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.wprog .fbar{flex:1;height:6px;background:rgba(255,255,255,.18)}
.wprog .fbar i{background:currentColor;transition:width .4s var(--ease)}
.exstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
.exchip{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;border:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-b);color:var(--ink2);font-size:14px;font-weight:500;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.exchip .num{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);font:600 13px var(--display);color:var(--ink)}
.exchip .num .ico{width:14px;height:14px}
.exchip.ok .num{background:var(--done);color:var(--done-ink)}
.exchip.on{background:var(--ink);color:var(--surface);box-shadow:none}
.exchip.on .num{background:rgba(255,255,255,.16);color:inherit}
.exchip.add{padding:0;width:40px;justify-content:center;font-size:20px}
.exhero{position:relative;border-radius:28px;overflow:hidden;min-height:220px;color:#fff;isolation:isolate;box-shadow:0 14px 34px rgba(17,19,24,.16)}
.exhero-in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:220px;padding:16px}

/* Bouton « Tous les paliers » en bulle liquid glass */
.tiers summary{list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;margin-top:4px;padding:0 14px 0 16px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--tx-1);
  background:linear-gradient(160deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 55%,rgba(255,255,255,.10) 100%);
  border:var(--bw) solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.25);
  -webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);transition:border-color .2s,transform .15s}
.tiers summary::-webkit-details-marker{display:none}
.tiers summary::after{content:"";width:7px;height:7px;margin-top:-3px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);opacity:.7;transition:transform .25s var(--ease),margin .25s}

.tiers summary:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}

window.__justSignedIn = false;
var lgMode = 'login';
function lgEl(id){ return document.getElementById(id); }
function lgShow(kind, text){
    var err = lgEl('lg-err'), ok = lgEl('lg-ok');
    err.hidden = true; ok.hidden = true;
    if (!text) return;
    var el = kind === 'ok' ? ok : err;

function lgErrText(e){
    var c = (e && e.code) || '';
    var M = {
        'auth/invalid-email': 'Adresse email invalide.',
        'auth/missing-email': 'Saisissez votre adresse email.',
        'auth/user-not-found': 'Email ou mot de passe incorrect.',

        'auth/user-disabled': 'Ce compte a été désactivé.',
        'auth/operation-not-allowed': 'Ce mode de connexion n’est pas activé pour l’application.',
        'auth/popup-blocked': 'La fenêtre Google a été bloquée par le navigateur.'
    };
    return M[c] || ('Connexion impossible' + (e && e.message ? ' : ' + e.message : '.'));
}
function lgBusy(on){
    var b = lgEl('lg-submit'), g = lgEl('lg-google');
    b.disabled = on; g.disabled = on;
    b.querySelector('span').textContent = on ? (lgMode === 'signup' ? 'Création…' : 'Connexion…') : (lgMode === 'signup' ? 'Créer mon compte' : 'Se connecter');
}
function etatBoutonLogin(enCours) {
    var b = lgEl('lg-google');
    if (!b) return;
    b.disabled = enCours;
    b.querySelector('span').textContent = enCours ? 'Connexion…' : 'Continuer avec Google';
}
function lgSetMode(m){
    lgMode = m;
    var su = m === 'signup';
    lgEl('lg-title').textContent = su ? 'Créer un compte' : 'Bienvenue';
    lgEl('lg-subt').textContent = su ? 'Quelques secondes pour commencer' : 'Connectez-vous pour retrouver vos séances';
    lgEl('lg-pass').setAttribute('autocomplete', su ? 'new-password' : 'current-password');
    lgEl('lg-forgot-row').hidden = su;
    lgEl('lg-sw-t').textContent = su ? 'Déjà un compte ?' : 'Pas encore de compte ?';
    lgEl('lg-switch').textContent = su ? 'Se connecter' : 'Créer un compte';
    lgShow(); lgBusy(false);
}
function connexionGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' }); // toujours proposer le choix du compte Google
    lgShow();
    window.__justSignedIn = true;
    etatBoutonLogin(true);
    auth.signInWithPopup(provider)
        .then(() => { etatBoutonLogin(false); })
        .catch((error) => {
            window.__justSignedIn = false;
            etatBoutonLogin(false);
            if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') return;
            lgShow('err', lgErrText(error));
        });
}
(function(){
    var form = lgEl('lg-form');
    if (!form) return;
    form.addEventListener('submit', function(e){
        e.preventDefault();
        var email = lgEl('lg-email').value.trim(), pass = lgEl('lg-pass').value;
        if (!email || !lgEl('lg-email').checkValidity()) { lgShow('err', 'Saisissez une adresse email valide.'); lgEl('lg-email').focus(); return; }
        if (pass.length < 6) { lgShow('err', 'Le mot de passe doit contenir au moins 6 caractères.'); lgEl('lg-pass').focus(); return; }
        lgShow(); lgBusy(true);
        window.__justSignedIn = true;
        var p = lgMode === 'signup' ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass);
        p.then(function(){ lgEl('lg-pass').value = ''; lgBusy(false); })
         .catch(function(err){ window.__justSignedIn = false; lgBusy(false); lgShow('err', lgErrText(err)); });
    });
    lgEl('lg-forgot').addEventListener('click', function(){
        var email = lgEl('lg-email').value.trim();
        if (!email || !lgEl('lg-email').checkValidity()) { lgShow('err', 'Saisissez d’abord votre adresse email ci-dessus.'); lgEl('lg-email').focus(); return; }
        auth.sendPasswordResetEmail(email)
            .then(function(){ lgShow('ok', 'Si un compte existe pour ' + email + ', un email de réinitialisation vient d’être envoyé.'); })
            .catch(function(err){ lgShow('err', lgErrText(err)); });
    });
    lgEl('lg-switch').addEventListener('click', function(){ lgSetMode(lgMode === 'login' ? 'signup' : 'login'); });
    lgEl('lg-eye').addEventListener('click', function(){
        var i = lgEl('lg-pass'), show = i.type === 'password';
        i.type = show ? 'text' : 'password';
        this.setAttribute('aria-pressed', show); this.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    });
})();

// 2. Normalisation pour s'assurer que toutes les propriétés existent sur les données chargées
function norm(o){
  var f = fresh(), fo = o.food || {};
  var settings = Object.assign(f.settings, o.settings || {}), routines = o.routines || f.routines;
  if (!settings.noDefRt) {
    // Une seule fois : on retire Push / Pull / Jambes s'ils ont été ajoutés d'office et jamais utilisés
    // (identiques à l'origine et absents du planning). Un programme modifié ou planifié est conservé.
    var plan = o.plan || [];
    routines = routines.filter(function(r){
      var d = DEFAULT_ROUTINES.filter(function(x){ return x.id === r.id; })[0];
      return !(d && d.name === r.name && JSON.stringify(d.items) === JSON.stringify(r.items) && plan.indexOf(r.id) < 0);
    });
    settings.noDefRt = 1;
  }
  return {
    v: 1,
    updatedAt: o.updatedAt || 0,
    settings: settings,
    customEx: o.customEx || [],
    routines: routines,
    sessions: o.sessions || [],
    body: o.body || [],
    plan: (o.plan && o.plan.length === 7) ? o.plan : f.plan,
    food: {
      goals: Object.assign({}, f.food.goals, fo.goals || {}),
      goal: fo.goal || '',
      gw: fo.gw || '',
      pf: Object.assign({ sex: '', age: '', h: '', act: 2 }, fo.pf || {}),
      log: fo.log || [],
      favs: fo.favs || [],
      prods: fo.prods || [],
      mp: fo.mp || [],
      shopx: fo.shopx || [],
      shopck: fo.shopck || {}
    },
    hy: { runs: (o.hy && o.hy.runs) || [], hyrox: (o.hy && o.hy.hyrox) || [], on: !!(o.hy && o.hy.on), plan: (o.hy && Array.isArray(o.hy.plan) && o.hy.plan.length === 7) ? o.hy.plan : null, done: (o.hy && o.hy.done) || {}, prev: (o.hy && o.hy.prev !== undefined) ? o.hy.prev : undefined, vma: (o.hy && o.hy.vma) || '', pk: hyPkNorm(o.hy && o.hy.pk), pkPrev: hyPkNorm(o.hy && o.hy.pkPrev) },
    steps: o.steps || {},
    sleep: o.sleep || {},
    rpg: Object.assign({}, f.rpg, o.rpg || {}),
    s20: { d: (o.s20 && o.s20.d && typeof o.s20.d === 'object') ? o.s20.d : {} },
    rpgRun: (function (r) { r = r || {}; return { qxp: +r.qxp || 0, claimed: r.claimed || {}, log: r.log || {}, lvlSeen: r.lvlSeen == null ? null : r.lvlSeen, tro: r.tro || {}, flags: r.flags || {}, prof: r.prof || 'deb' } })(o.rpgRun),
    profile: { name: (o.profile && o.profile.name) || '', photo: (o.profile && o.profile.photo) || '', banner: (o.profile && o.profile.banner) || '', done: !!(o.profile && o.profile.done) },
    active: o.active || null
  };
}

function pushRemote(){
  clearTimeout(pushT);
  if(!dbDoc)return Promise.resolve();
  /* Tant que la version en ligne n'a pas été lue, on n'écrit rien : sinon un état vide
     (juste après une reconnexion) pourrait remplacer les données du compte. */
  if(!remoteSeen)return Promise.resolve();
  if(pushing){pushAgain=true;return Promise.resolve()}
  if(S.updatedAt<=getSynced())return Promise.resolve();
  var doc=dbDoc,stamp=S.updatedAt,base=getSynced();
  pushing=true;setSync('saving');
  /* Transaction : on relit la version en ligne au moment d'écrire. Si un autre appareil
     a enregistré entre-temps, on fusionne au lieu d'écraser. Hors connexion, la transaction
     échoue proprement et sera relancée au retour du réseau. */
  return db.runTransaction(function(tx){
    return tx.get(doc).then(function(snap){
      var out=S;
      if(snap.exists){
        var d=snap.data(),r=parseRemote(d),rt=r?(r.updatedAt||0):0;
        if(r&&d.dev!==DEVICE&&rt>base&&rt!==S.updatedAt){out=mergeStates(S,r);out.updatedAt=Math.max(Date.now(),rt+1)}
      }
      var js=JSON.stringify(out);
      if(js.length>850000&&!sizeWarned){sizeWarned=true;toast('Votre historique devient très volumineux : la sauvegarde en ligne approche de sa limite.')}
      tx.set(doc,{json:js,updatedAt:out.updatedAt,v:2,dev:DEVICE});
      return out;
    });
  }).then(function(out){
    if(doc!==dbDoc)return;
    if(out!==S){
      if(S.updatedAt===stamp){S=out;storeLocal();softRender()}
      else{S=mergeStates(S,out);S.updatedAt=Date.now();storeLocal();softRender()}
    }
    if(out.updatedAt>getSynced())setSynced(out.updatedAt);
    setSync(S.updatedAt>getSynced()?'saving':'ok');
  },function(err){
    console.error('Synchronisation impossible :',err);
    setSync('error');
    clearTimeout(pushT);pushT=setTimeout(function(){if(syncState==='error')pushRemote()},20000);
  }).then(function(){
    pushing=false;
    if(pushAgain||(dbDoc&&S.updatedAt>getSynced()&&syncState!=='error')){pushAgain=false;pushT=setTimeout(pushRemote,400)}
  });
}
function parseRemote(d){
  if(!d)return null;
  try{
    if(typeof d.json==='string'){var o=JSON.parse(d.json);o.updatedAt=d.updatedAt||o.updatedAt||0;return o}
    if(d.sessions||d.routines)return d; /* ancien format : l'état brut */
  }catch(e){console.error('Données en ligne illisibles :',e)}
  return null;
}
function byKey(a,b,k){
  k=k||'id';var seen={},out=[];
  (a||[]).concat(b||[]).forEach(function(x){
    if(!x)return;var v=x[k];
    if(v==null){out.push(x);return}
    if(!seen[v]){seen[v]=1;out.push(x)}
  });
  return out;
}
/* Fusionne deux états : la version la plus récente gagne en cas de conflit sur un même élément,
   les éléments présents d'un seul côté sont conservés. */
function mergeStates(a,b){
  var n=(a.updatedAt||0)>=(b.updatedAt||0)?a:b,o=n===a?b:a;
  n=norm(JSON.parse(JSON.stringify(n)));o=norm(JSON.parse(JSON.stringify(o)));
  var m=n;
  m.sessions=byKey(n.sessions,o.sessions).sort(function(x,y){return x.start-y.start});
  m.body=byKey(n.body,o.body);
  m.customEx=byKey(n.customEx,o.customEx);
  m.routines=byKey(n.routines,o.routines);
  m.food.log=byKey(n.food.log,o.food.log);
  m.food.favs=byKey(n.food.favs,o.food.favs);
  m.food.mp=byKey(n.food.mp,o.food.mp);
  m.food.shopx=byKey(n.food.shopx,o.food.shopx);
  m.food.prods=byKey(n.food.prods,o.food.prods,'code');
  m.steps=Object.assign({},o.steps,n.steps);
  m.sleep=Object.assign({},o.sleep,n.sleep);
  m.rpg.water=Object.assign({},o.rpg.water,n.rpg.water);
  m.rpg.claimed=Object.assign({},o.rpg.claimed,n.rpg.claimed);
  m.rpg.qxp=Math.max(n.rpg.qxp||0,o.rpg.qxp||0);
  m.rpgRun.log=Object.assign({},o.rpgRun.log,n.rpgRun.log);
  m.rpgRun.claimed=Object.assign({},o.rpgRun.claimed,n.rpgRun.claimed);
  m.rpgRun.qxp=Math.max(n.rpgRun.qxp||0,o.rpgRun.qxp||0);
  m.rpgRun.tro=Object.assign({},o.rpgRun.tro,n.rpgRun.tro);
  m.rpgRun.flags=Object.assign({},o.rpgRun.flags,n.rpgRun.flags);
  m.s20={d:(function(x,y){var r=Object.assign({},x);Object.keys(y).forEach(function(k){if(!(k in r)||Math.abs(+y[k]||0)>Math.abs(+r[k]||0))r[k]=y[k]});return r})(o.s20.d,n.s20.d)};
  m.hy={runs:byKey(n.hy.runs,o.hy.runs),hyrox:byKey(n.hy.hyrox,o.hy.hyrox),on:n.hy.on,plan:n.hy.plan,done:Object.assign({},o.hy.done,n.hy.done),prev:n.hy.prev,vma:n.hy.vma||o.hy.vma||'',pk:n.hy.pk,pkPrev:n.hy.pkPrev};
  if(!m.active&&o.active&&!m.sessions.some(function(s){return s.id===o.active.id}))m.active=o.active;
  if(!m.profile.photo&&o.profile.photo)m.profile.photo=o.profile.photo;
  if(!m.profile.banner&&o.profile.banner)m.profile.banner=o.profile.banner;
  if(!m.profile.name&&o.profile.name)m.profile.name=o.profile.name;
  return m;
}
function softRender(){
  var ae=document.activeElement;
  if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.closest&&ae.closest('#view,#sheet')){clearTimeout(softT);softT=setTimeout(softRender,1500);return}
  render();
}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(!snap.exists&&snap.metadata&&snap.metadata.fromCache)return; /* pas encore de réponse du serveur */
  remoteSeen=true;
  if(obPending)setTimeout(decideOnboard,0); /* après chargement des données du compte */
  if(!snap.exists){if(S.updatedAt>0)pushRemote();else setSync('ok');return}
  var d=snap.data(),r=parseRemote(d);
  if(!r){setSync('error');return}
  var rt=r.updatedAt||0,base=getSynced(),dirty=S.updatedAt>base;
  if(rt===S.updatedAt||(d.dev===DEVICE&&S.updatedAt>=rt)){
    if(rt>base)setSynced(rt);
    setSync(S.updatedAt>getSynced()?'saving':'ok');return;
  }
  if(!dirty&&rt>S.updatedAt){
    S=norm(r);S.updatedAt=rt;storeLocal();setSynced(rt);setSync('ok');softRender();return;
  }
  if(dirty&&rt<=base){pushRemote();return}
  if(!dirty&&rt<S.updatedAt){pushRemote();return}
  /* Les deux côtés ont changé depuis la dernière synchro : on fusionne. */
  S=mergeStates(S,r);S.updatedAt=Math.max(Date.now(),rt+1);storeLocal();setSynced(rt);softRender();pushRemote();
}
function stopSync(){
  if(unsub){try{unsub()}catch(e){}}
  unsub=null;dbDoc=null;uidCur=null;remoteSeen=false;clearTimeout(pushT);pushing=false;pushAgain=false;
}
function startSync(user){
  if(uidCur===user.uid&&unsub)return;
  stopSync();
  DEVICE=uid()+uid();
  uidCur=user.uid;KEY='rebound-'+uidCur;
  try{localStorage.setItem('rebound-last-uid',uidCur)}catch(e){}
  var cached=null,legacy=null;
  try{var c=localStorage.getItem(KEY);if(c)cached=norm(JSON.parse(c))}catch(e){}
  try{if(!localStorage.getItem(LEGACY_KEY+'-migrated')){var l=localStorage.getItem(LEGACY_KEY);if(l)legacy=norm(JSON.parse(l))}}catch(e){}
  S=cached||fresh();
  if(legacy&&legacy.updatedAt>0){
    /* Première connexion avec cette version sur cet appareil : on récupère les données
       enregistrées localement par l'ancienne version, puis on les fusionne avec le compte. */
    S=cached?mergeStates(S,legacy):legacy;
    S.updatedAt=Date.now();
    try{localStorage.setItem(LEGACY_KEY+'-migrated',uidCur)}catch(e){}
  }
  storeLocal();
  dbDoc=db.collection('users').doc(uidCur);
  setSync('loading');
  obPending=true;clearTimeout(obTimer);obTimer=setTimeout(decideOnboard,4000);
  unsub=dbDoc.onSnapshot(onRemote,function(err){console.error('Écoute Firestore impossible :',err);setSync('error')});
  render();
}

function e1rm(kg,reps){kg=+kg||0;reps=+reps||0;if(!kg||!reps)return 0;return reps===1?kg:kg*(1+reps/30)}
function lastPerf(ex){
  for(var i=S.sessions.length-1;i>=0;i--){
    var e=S.sessions[i].exs.filter(function(x){return x.ex===ex})[0];
    if(e&&e.sets.length)return e.sets;

}
function bestE1(ex){

function overload(ex,n,r){
  var lp=lastPerf(ex);

  var w=Infinity;
  for(var i=0;i<lp.length;i++){
    if(!(+lp[i].kg>0)||!(+lp[i].reps>=r))return null;

/* Suggestion du jour par série (double progression dans la fourchette conseillée de l'exercice) :

function rrParse(t){var m=/^(\d+)\s*(?:à|-|–)\s*(\d+)$/.exec(String(t||'').trim());return m?[+m[1],+m[2]]:null}
function repRange(ex,rr){return rrParse(rr)||rrParse(exDetail(ex).rx[1])}
function sugSet(p,rg){
  if(!p||!rg||!(+p.reps>0))return null;

  if(r>=rg[1]&&kg>0)return {kg:Math.round((kg+(kg>=20?2.5:1))*100)/100,reps:rg[0],up:1};
  return {kg:kg,reps:Math.min(rg[1],r+1),up:0};
}

function streakInfo(){
  var goal=S.settings.goal||3,cnt={};
  activityTimes().forEach(function(t){var k=monday(t).getTime();cnt[k]=(cnt[k]||0)+1});
  var wk=monday(Date.now()),cur=cnt[wk.getTime()]||0,streak=cur>=goal?1:0,d=new Date(wk);
  d.setDate(d.getDate()-7);
  while((cnt[d.getTime()]||0)>=goal){streak++;d.setDate(d.getDate()-7)}
  var keys=Object.keys(cnt).map(Number).sort(function(a,b){return a-b}),best=0;
  if(keys.length){
    var w=new Date(keys[0]),run=0,end=wk.getTime();
    while(w.getTime()<=end){if((cnt[w.getTime()]||0)>=goal){run++;if(run>best)best=run}else run=0;w.setDate(w.getDate()+7)}
  }
  return {goal:goal,cur:cur,streak:streak,best:best};
}

var LIFTS=[
  {id:'dc',name:'Développé couché',r:[0.6,0.8,1,1.25,1.5,1.8,2],mode:'x'},
  {id:'sq',name:'Squat',r:[0.8,1,1.25,1.5,1.8,2.1,2.5],mode:'x'},
  {id:'sdt',name:'Soulevé de terre',r:[1,1.25,1.5,1.8,2.2,2.6,3],mode:'x'},
  {id:'tr',name:'Tractions lestées',r:[0,0.1,0.25,0.5,0.75,1,1.25],mode:'lest'},
  {id:'dip',name:'Dips lestés',r:[0,0.15,0.3,0.6,0.9,1.2,1.5],mode:'lest'},
  {id:'di',name:'Développé incliné',r:[0.5,0.65,0.85,1.05,1.3,1.5,1.75],mode:'x',note:'Avec des haltères, comptez la charge totale des deux.'},
  {id:'ht',name:'Hip Thrust',r:[1,1.4,1.8,2.2,2.7,3.2,3.8],mode:'x'}
];
function bodyKg(){var b=S.body.filter(function(x){return x.kg>0}).sort(function(a,c){return c.t-a.t})[0];return b?b.kg:0}
function liftBest(ex){
  var best=0,any=false;
  S.sessions.forEach(function(se){se.exs.forEach(function(e){
    if(e.ex!==ex)return;
    e.sets.forEach(function(t){var kg=+t.kg||0,r=+t.reps||0;if(r<1||r>12)return;any=true;if(kg>0)best=Math.max(best,e1rm(kg,r))});
  })});
  return {best:best,any:any};
}
function liftLevels(){
  var bw=bodyKg();
  return LIFTS.map(function(L){
    var m=liftBest(L.id),thr=L.r.map(function(x){return bw>0?Math.round(x*bw*2)/2:0}),lvl=-1;
    if(bw>0)for(var i=0;i<thr.length;i++){if(m.any&&m.best>=thr[i])lvl=i;else break}
    return {id:L.id,name:L.name,note:L.note,mode:L.mode,r:L.r,bw:bw,cur:m.best,any:m.any,thr:thr,level:lvl};
  });
}
function trophyDone(){
  var o={};
  trophyData().forEach(function(x){if(x.cur>=x.target)o[x.id]=true});
  liftLevels().forEach(function(L){for(var i=0;i<=L.level;i++)o[L.id+':'+i]=true});
  return o;
}
function newTrophies(before){
  var a=trophyDone(),names={},out=[];
  trophyData().forEach(function(x){names[x.id]=x.name});
  liftLevels().forEach(function(L){for(var i=0;i<7;i++)names[L.id+':'+i]=L.name+' · '+TIERS[i]});
  Object.keys(a).forEach(function(k){if(!before[k])out.push({name:names[k]||k})});
  return out;
}
function troCard(x){
  var done=x.cur>=x.target,pct=Math.min(100,x.cur/x.target*100);
  return '<div class="tro'+(done?' done':'')+'"><span class="medal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></span>'+
    '<div><b>'+esc(x.name)+'</b><span class="sub">'+esc(x.desc)+'</span>'+(done?'':'<div class="fbar" role="progressbar" aria-label="'+esc(x.name)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i style="width:'+pct.toFixed(0)+'%"></i></div>')+'</div>'+
    '<span class="tv">'+(done?'Atteint':esc(fmt(x.cur)+' / '+fmt(x.target)+(x.unit||'')))+'</span></div>';
}
function bwForm(){
  var bw=bodyKg();
  return '<div class="bwbox"><label class="lab" for="tw">Poids de corps (kg)<input id="tw" class="field" inputmode="decimal" placeholder="75" value="'+(bw?esc(fmt(bw)):'')+'"></label><button class="btn" data-act="setbw">Enregistrer</button>'+
    '<p class="hint" id="bwmsg" role="status">'+(bw?'Les paliers suivent votre poids de corps actuel.':'Renseignez votre poids pour calculer vos paliers.')+' Ils utilisent votre 1RM estimé, sur des séries de 1 à 12 répétitions.</p></div>';
}
function liftCard(L){
  var dots='',lest=L.mode==='lest';
  for(var i=0;i<7;i++){
    var on=i<=L.level;
    dots+='<img class="md'+(on?' on':'')+(i===L.level?' cur':'')+'" src="'+MEDAL[i]+'" alt="" width="44" height="44" title="'+TIERS[i]+(on?' · atteint':' · non atteint')+'">';
  }
  var h='<div class="lift"><div class="lh"><b>'+esc(L.name)+'</b><span class="lv">'+(L.level>=0?'Niveau '+TIERS[L.level]:'Pas encore de niveau')+'</span></div>'+
    '<div class="tdots" role="img" aria-label="'+(L.level>=0?'Niveau '+TIERS[L.level]+' atteint sur 7':'Aucun niveau atteint')+'">'+dots+'</div>';
  if(!L.bw){h+='<p class="sub">Renseignez votre poids de corps pour voir les paliers.</p></div>';return h}
  if(L.level>=6)h+='<p class="sub">Niveau Ultra atteint.</p>';
  else{
    var nx=L.level+1,target=L.thr[nx],prev=L.level>=0?L.thr[L.level]:0,pct=target>prev?Math.max(0,Math.min(100,(L.cur-prev)/(target-prev)*100)):0;
    var txt=(lest&&target===0)?'Prochain : '+TIERS[nx]+', une série au poids de corps.':'Prochain : '+TIERS[nx]+' à '+(lest?'+':'')+fmt(target)+' kg'+(L.any?' · actuel '+fmt(L.cur)+' kg':' · aucune série enregistrée');
    h+='<p class="sub">'+txt+'</p>'+(target>0?'<div class="fbar" role="progressbar" aria-label="Progression vers '+TIERS[nx]+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i style="width:'+pct.toFixed(0)+'%"></i></div>':'');
  }
  if(L.note)h+='<p class="hint">'+esc(L.note)+'</p>';
  h+='<details class="tiers"><summary>Tous les paliers</summary>';
  for(var k=0;k<7;k++){
    var rr=L.r[k],ratio=lest?(rr===0?'Poids de corps':'+'+Math.round(rr*100)+' % du PdC'):String(rr).replace('.',',')+' × PdC';
    var kg=lest?(rr===0?'—':'+'+fmt(L.thr[k])+' kg'):fmt(L.thr[k])+' kg'+(k===6?' et +':'');
    h+='<div class="trow'+(k===L.level?' cur':'')+'"><span class="tn"><img src="'+MEDAL[k]+'" alt="" width="24" height="24">'+TIERS[k]+'</span><span>'+ratio+'</span><span>'+kg+'</span></div>';
  }
  return h+'</details></div>';
}
function viewTroph(){
  var T=trophyData(),got=T.filter(function(x){return x.cur>=x.target}),todo=T.filter(function(x){return x.cur<x.target});
  var LV=liftLevels(),tiersDone=0;LV.forEach(function(L){tiersDone+=L.level+1});
  var h='<div class="stack"><h2 class="h">Paliers de force</h2>'+bwForm();
  h+='<p class="sub"><b>'+tiersDone+'</b> palier'+(tiersDone>1?'s':'')+' atteint'+(tiersDone>1?'s':'')+' sur '+(LV.length*7)+'.</p>';
  h+=LV.map(liftCard).join('');
  h+='<h2 class="h">Autres trophées · '+got.length+'/'+T.length+'</h2>';
  if(got.length)h+=got.map(troCard).join('');
  if(todo.length)h+=todo.map(troCard).join('');
  return h+'</div>';
}
function weekSets(off){
  var st=monday(Date.now());st.setDate(st.getDate()-7*off);
  var en=new Date(st);en.setDate(en.getDate()+7);
  var out={};

function series(ex){
  var out=[];
  S.sessions.forEach(function(s){
    var e=s.exs.filter(function(x){return x.ex===ex})[0];
    if(!e||!e.sets.length)return;
    var p={t:s.start,e1:0,mx:0,vol:0,mxReps:0};
    e.sets.forEach(function(t){
      var kg=+t.kg||0,r=+t.reps||0;
      p.e1=Math.max(p.e1,e1rm(kg,r));p.vol+=kg*r;
      if(kg>p.mx||(kg===p.mx&&r>p.mxReps)){p.mx=kg;p.mxReps=r}

  });
  return out;
}
function niceStep(range){
  var L=[1,2,2.5,5,10,20,25,50,100,200,250,500,1000,2000,5000];
  for(var i=0;i<L.length;i++)if(range*1.3/L[i]<=4)return L[i];
  return L[L.length-1];
}
function lineChart(pts,F){

  var vs=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  var range=Math.max(mx-mn,mx*0.1,2),step=niceStep(range);
  var lo=Math.floor((mn-range*0.15)/step)*step;if(lo<0&&mn>=0)lo=0;
  var N=Math.max(2,Math.ceil((mx+range*0.15-lo)/step));
  var hi=lo+N*step;
  function y(v){return B-(v-lo)/(hi-lo)*(B-T)}
  function x(i){return pts.length===1?(L+R)/2:L+i*(R-L)/(pts.length-1)}
  var g='';
  for(var n=0;n<=N;n++){var v=lo+n*step,yy=y(v);g+='<line x1="'+L+'" x2="'+R+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+F(v)+'</text>'}
  var d=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)}).join(' ');
  var area='M'+x(0).toFixed(1)+' '+B+' '+pts.map(function(p,i){return 'L'+x(i).toFixed(1)+' '+y(p.v).toFixed(1)}).join(' ')+' L'+x(pts.length-1).toFixed(1)+' '+B+' Z';
  var dots='';
  pts.forEach(function(p,i){var last=i===pts.length-1;dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(last?5.5:3.5)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'});
  var lp=pts[pts.length-1];
  var lab='<text class="val" x="'+x(pts.length-1).toFixed(1)+'" y="'+(y(lp.v)-11).toFixed(1)+'" text-anchor="'+(pts.length===1?'middle':'end')+'">'+F(lp.v)+'</text>';
  var xl='<text x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+esc(dfmt(pts[0].t,{day:'numeric',month:'short'}))+'</text>';

    (pts.length>1?'<path d="'+area+'" fill="var(--accent)" fill-opacity="0.12"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+dots+lab+xl+'</svg>';
}
function weekBars(){

/* ---- Calculateur énergétique (métabolisme de base + besoins en calories) ----

var CAL_F=[['hb','Harris et Benedict (1919)'],['hbr','Harris et Benedict révisée (1984)'],['msj','Mifflin-St Jeor (1990)']];
var CAL_ACT=[['1.2','Sédentaire (pas ou peu d’exercice)'],['1.375','Légèrement actif (exercices légers ou sport 1 à 3 fois par semaine)'],['1.55','Modérément actif (exercices modérés 3 à 5 fois par semaine)'],['1.725','Très actif (exercices soutenus 6 à 7 fois par semaine)'],['1.9','Intensément actif (exercices intenses et métier physique)']];

function calState(){
  if(!ui.cal){var pf=S.food.pf||{},kg=bodyKg()||+S.food.gw||'';
    ui.cal={f:'hb',sx:pf.sex==='f'?'f':pf.sex==='h'?'h':'',age:pf.age>0?String(pf.age):'',h:pf.h>0?String(pf.h):'',kg:kg?String(kg):'',act:'1.2',obj:'0',mb:0,td:0}}
  return ui.cal;
}
function calNum(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?NaN:n}
function calBMR(c){
  var a=calNum(c.age),h=calNum(c.h),k=calNum(c.kg),m=c.sx==='h';
  if(c.sx!=='h'&&c.sx!=='f')return {err:'Choisissez Femme ou Homme.'};
  if(!(a>=12&&a<=100))return {err:'Indiquez un âge entre 12 et 100 ans.'};
  if(!(h>=100&&h<=250))return {err:'Indiquez une taille entre 100 et 250 cm.'};
  if(!(k>=30&&k<=300))return {err:'Indiquez un poids entre 30 et 300 kg.'};
  var v=c.f==='msj'?10*k+6.25*h-5*a+(m?5:-161)

function demoSessions(){
  var now=Date.now(),day=864e5,out=[];
  var plan=[['Push',[['dc',60,8],['dm',35,8],['ep',25,12]]],['Pull',[['tr',0,8],['rb',55,8],['cb',30,10]]],['Jambes',[['sq',80,6],['sr',70,8],['pr',140,12]]]];
  for(var w=0;w<5;w++)plan.forEach(function(p,k){
    var start=now-(4-w)*7*day-(2-k)*2*day-3*3600e3;
    out.push({id:'demo-'+w+'-'+k,demo:true,name:p[0],start:start,end:start+(52+k*4)*60000,
      exs:p[1].map(function(x){return {ex:x[0],sets:[0,1,2].map(function(i){return {kg:x[1]?x[1]+w*2.5:0,reps:x[2]+(i===2?-1:0)+(w%2?1:0)}})}})});
  });
  return out;
}

var RUNT={

var RUN_ORDER=['ez','tempo','vma','long','act','rest'];

var DAYS_L=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'],DAYS_S=['L','M','M','J','V','S','D'];
function mDay(i){
  var r=planFor(i);if(!r)return null;
  var t=0,l=0;(r.items||[]).forEach(function(it){var n=+it.sets||3;t+=n;if(exInfo(it.ex).g==='Jambes')l+=n});

function mWeek(){var a=[];for(var i=0;i<7;i++)a.push(mDay(i));return a}

/* Génère un planning de course équilibré : on essaie toutes les positions possibles des séances
   intenses (sortie longue, VMA ou tempo) puis on complète en endurance fondamentale,
   et on garde la combinaison qui déclenche le moins d'alertes. */
function genRun(mw){
  var m=mw.filter(Boolean).length,n=m>=6?1:m>=5?2:m<=2?4:3,best=null,bc=1e9;
  function fill(p){
    var placed=p.filter(function(x){return x!=='rest'}).length;
    var order=[0,1,2,3,4,5,6].sort(function(a,b){return ((mw[a]?1:0)-(mw[b]?1:0))||a-b});
    for(var k=0;k<order.length&&placed<n;k++){
      var i=order[k];if(p[i]!=='rest'||(mw[i]&&mw[i].heavy))continue;
      var pr=0;for(var j=0;j<7;j++)if(!mw[j]&&p[j]==='rest')pr++;
      if(!mw[i]&&pr<=1)continue;
      p[i]='ez';placed++;

    for(var d=0;d<7;d++){var pv=(d+6)%7;if(p[d]==='rest'&&!mw[d]&&mw[pv]&&mw[pv].heavy){var c=0;for(var e=0;e<7;e++)if(!mw[e]&&p[e]==='rest')c++;if(c>1)p[d]='act'}}
    return p;
  }
  var hardT=n>=2?['vma','tempo',null]:[null];
  for(var L=-1;L<7;L++){
    if(L>=0&&n<3)continue;
    for(var V=-1;V<7;V++){
      if(V===L&&V>=0)continue;
      for(var t=0;t<hardT.length;t++){
        var ht=hardT[t];if((ht===null)!==(V<0))continue;
        var p=['rest','rest','rest','rest','rest','rest','rest'];
        if(L>=0)p[L]='long';if(V>=0)p[V]=ht;
        p=fill(p);
        var an=analyzeWeek(mw,p,null),cost=0;
        an.iss.forEach(function(x){cost+=x.l==='high'?10:3});
        var runs=p.filter(function(x){return x!=='rest'&&x!=='act'}).length;
        cost+=Math.abs(runs-n)*2.5;
        if(n>=3&&L<0)cost+=2;
        if(n>=2&&V<0)cost+=2;
        if(ht==='tempo')cost+=.5;
        if(L===5||L===6)cost-=.6;
        if(V>=0&&mw[V])cost+=.4;
        if(L>=0&&mw[L])cost+=.8;

        if(cost<bc){bc=cost;best=p}

    }
  }

}

function analyzeWeek(mw,rp,mm){

    var prv=(i2+6)%7,nx=(i2+1)%7;
    if(mw[i2]&&mw[i2].heavy)iss.push({l:'high',t:r2.n+' et jambes lourdes le même jour ('+DAYS_L[i2]+')',w:'Les membres inférieurs encaissent deux gros efforts sans récupération : fatigue musculaire et articulaire, qualité des deux séances en baisse.'});
    else if(mw[prv]&&mw[prv].heavy)iss.push({l:'high',t:r2.n+' le lendemain d’une séance jambes ('+DAYS_L[i2]+')',w:'Quadriceps, ischios et mollets ne sont pas encore récupérés : la séance de course sera moins bonne et le risque de blessure augmente.'});
    else if(mw[nx]&&mw[nx].heavy)iss.push({l:'mid',t:r2.n+' la veille d’une séance jambes ('+DAYS_L[i2]+')',w:'Vous arriverez fatigué à la séance jambes : charges en baisse et récupération incomplète.'});
    if(RUNT[rp[nx]]&&RUNT[rp[nx]].hard)iss.push({l:'mid',t:'Deux séances de course intenses d’affilée ('+DAYS_L[i2]+' et '+DAYS_L[nx]+')',w:'Les séances intenses demandent 48 h pour être assimilées. Enchaînées, elles mènent à la stagnation.'});

  else if(sess>=9)iss.push({l:'mid',t:sess+' séances dans la semaine',w:'Volume élevé : surveillez le sommeil, les douleurs et la baisse de performance.'});
  if(rest===0)iss.push({l:'mid',t:'Aucun vrai jour de repos',w:'Sans jour off, la fatigue ne redescend jamais complètement.'});
  if(mins>300)iss.push({l:'mid',t:'Plus de 5 h de course prévues',w:'Un volume de course élevé ajouté à la musculation augmente l’effet d’interférence et le risque de blessure.'});
  var lvl=iss.some(function(x){return x.l==='high'})||score>=12?'high':(iss.length||score>=10)?'mid':'ok';
  return {iss:iss,score:score,lvl:lvl,sess:sess,mins:mins,hard:hard};

var ANAT_CUT={},ANAT_MISS={},ANAT_BUSY={};
function anatCut(sex){
  if(ANAT_CUT[sex]||ANAT_MISS[sex]||ANAT_BUSY[sex])return;ANAT_BUSY[sex]=1;
  var im=new Image();
  im.onerror=function(){ANAT_BUSY[sex]=0;ANAT_MISS[sex]=1;anatRefresh()};
  im.onload=function(){
    ANAT_BUSY[sex]=0;
    try{
      var k=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var c=cv.getContext('2d');c.drawImage(im,0,0,w,h);var id=c.getImageData(0,0,w,h),d=id.data,n=w*h,seen=new Uint8Array(n),st=new Int32Array(n),sp=0;
      function light(p){var r=d[p*4],g=d[p*4+1],b=d[p*4+2],mn=Math.min(r,g,b),mx=Math.max(r,g,b);return mn>196&&mx-mn<34?mn:0}
      function push(p){if(!seen[p]&&light(p)){seen[p]=1;st[sp++]=p}}
      for(var x=0;x<w;x++){push(x);push((h-1)*w+x)}
      for(var y=0;y<h;y++){push(y*w);push(y*w+w-1)}
      (ANAT_IMG[sex].keep||[]).forEach(function(e){var cx=e[0]*k,cy=e[1]*k,rx=e[2]*k,ry=e[3]*k;
        for(var yy=Math.max(0,Math.floor(cy-ry));yy<=Math.min(h-1,Math.ceil(cy+ry));yy++)for(var xx=Math.max(0,Math.floor(cx-rx));xx<=Math.min(w-1,Math.ceil(cx+rx));xx++){
          var dx=(xx-cx)/rx,dy=(yy-cy)/ry;if(dx*dx+dy*dy<=1)seen[yy*w+xx]=1}});
      (ANAT_IMG[sex].seeds||[]).forEach(function(q){push(Math.round(q[1]*k)*w+Math.round(q[0]*k))});
      while(sp){var p=st[--sp],px=p%w;
        var mn=light(p);d[p*4+3]=Math.round(255*Math.max(0,Math.min(1,(244-mn)/40)));
        if(px>0)push(p-1);if(px<w-1)push(p+1);if(p>=w)push(p-w);if(p<n-w)push(p+w)}
      c.putImageData(id,0,0);
      cv.toBlob(function(bl){ANAT_CUT[sex]=bl?URL.createObjectURL(bl):'raw';anatRefresh()},'image/png');
    }catch(e){ANAT_CUT[sex]='raw';anatRefresh()}
  };
  im.src=ANAT_IMG[sex].src;
}

function s20Types(w){return S20_WEEKS[w][1].map(function(s,i){return s.k==='v'||s.k==='r'?'vma':(s.k==='s'||s.k==='a')?'tempo':(S20_MIN[w][i]>=60?'long':'ez')})}

   que si son type correspond encore à la séance : changer le type d'un jour coupe le lien. */
function hyPkInfo(rp,pk){
  if(pk===undefined)pk=S.hy&&S.hy.pk;

  var out=[],any=false;
  for(var i=0;i<7;i++){
    var m=/^w([1-8])s([1-3])$/.exec(pk.d[i]||''),v=null;
    if(m){var w=+m[1]-1,j=+m[2]-1;if(s20Types(w)[j]===rp[i]){v={k:pk.d[i],w:w,j:j,s:S20_WEEKS[w][1][j],min:S20_MIN[w][j]};any=true}}

/* Placement : on teste toutes les positions des 3 séances et on garde la moins coûteuse
   (alertes de la charge, 48 h entre deux séances intenses, jours sans musculation, ordre S1 → S2 → S3). */
function s20Place(w){
  var mw=mWeek(),T=s20Types(w),M=S20_MIN[w],best=null,bc=1e9;
  for(var a=0;a<7;a++)for(var b=0;b<7;b++)for(var c=0;c<7;c++){
    if(a===b||a===c||b===c)continue;
    var pos=[a,b,c],p=['rest','rest','rest','rest','rest','rest','rest'],mm=[null,null,null,null,null,null,null];
    for(var k=0;k<3;k++){p[pos[k]]=T[k];mm[pos[k]]=M[k]}

    an.iss.forEach(function(x){cost+=x.l==='high'?10:3});

    for(var x=0;x<hd.length;x++)for(var y=x+1;y<hd.length;y++)if(cyc(hd[x],hd[y])<2)cost+=4;

  if(!(kg>=30&&kg<=300))return bad('ob-kg','Indiquez votre poids en kilos (entre 30 et 300).');
  if(!(age>=12&&age<=100))return bad('ob-age','Indiquez votre âge (entre 12 et 100 ans).');
  if(sx!=='h'&&sx!=='f'){msg.textContent='Choisissez votre sexe.';var r=document.querySelector('input[name="ob-sex"]');if(r)r.focus();return false}
  kg=Math.round(kg*10)/10;
  S.profile.name=name;S.profile.done=true;
  S.food.pf.h=Math.round(h);S.food.pf.age=Math.round(age);S.food.pf.sex=sx;S.food.gw=kg;
  if(Math.abs(kg-bodyKg())>0.05)S.body.push({id:uid(),t:Date.now(),kg:kg});
  save();ui.tab='home';render();$('#view').scrollTop=0;toast('Profil enregistré');
  return true;
}

/* ---- Progression ---- */
function allStats(){var n=S.sessions.length,vol=0,sets=0,ms=0;S.sessions.forEach(function(s){vol+=sessVol(s);ms+=Math.max(0,s.end-s.start);s.exs.forEach(function(e){sets+=e.sets.length})});return {n:n,vol:vol,sets:sets,ms:ms}}
function barChart(items,F,label){
  var W=360,H=150,L=8,R=352,B=112,T=24,bw=(R-L)/items.length,out='';
  var mx=Math.max(1,Math.max.apply(null,items.map(function(d){return d.v})));
  items.forEach(function(d,i){
    var bh=d.v/mx*(B-T),x0=L+i*bw+7,w=bw-14,last=i===items.length-1;
    out+='<rect x="'+x0.toFixed(1)+'" y="'+(B-Math.max(bh,3)).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(bh,3).toFixed(1)+'" rx="'+Math.min(8,w/2).toFixed(1)+'" fill="'+(last?'var(--acc)':d.v?'var(--slate)':'var(--line)')+'"/>';
    if(d.v)out+='<text class="val" x="'+(x0+w/2).toFixed(1)+'" y="'+(B-bh-7).toFixed(1)+'" text-anchor="middle">'+F(d.v)+'</text>';
    out+='<text x="'+(x0+w/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(d.lab)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+out+'</svg>';
}
function weeksData(fn){
  var base=monday(Date.now()),out=[];
  for(var i=7;i>=0;i--){var d=new Date(base);d.setDate(d.getDate()-i*7);out.push({t:d.getTime(),v:0,lab:dfmt(d,{day:'numeric',month:'numeric'})})}
  S.sessions.forEach(function(s){var m=monday(s.start).getTime();out.forEach(function(w){if(w.t===m)w.v+=fn(s)})});
  return out;
}
function spark(pts){
  if(pts.length<2)return '';
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),r=mx-mn||1,W=84,H=30;
  var d=pts.map(function(v,i){return (i?'L':'M')+(i*(W-4)/(pts.length-1)+2).toFixed(1)+' '+(H-3-(v-mn)/r*(H-6)).toFixed(1)}).join(' ');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function topRecords(){
  var best={};
  S.sessions.forEach(function(s){s.exs.forEach(function(e){e.sets.forEach(function(t){var v=e1rm(t.kg,t.reps);if(v>0&&(!best[e.ex]||v>best[e.ex].e1))best[e.ex]={ex:e.ex,e1:v,kg:+t.kg,reps:+t.reps,t:s.start}})})});
  return Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){return b.e1-a.e1});
}
function viewApercu(){
  if(!S.sessions.length)return '<div class="stack">'+streakCard()+'<div class="empty"><h2>Pas encore de données</h2><p>Terminez vos premières séances : vos statistiques, records et courbes apparaîtront ici.</p>'+
    '<button class="btn" data-act="tabseance">Démarrer une séance</button><button class="link" data-act="demo">Voir avec des données d’exemple</button></div></div>';
  var st=allStats(),h='<div class="stack">';
  if(S.sessions.some(function(s){return s.demo}))h+='<div class="banner"><span>Des séances d’exemple sont affichées.</span><button class="mini" data-act="nodemo">Les supprimer</button></div>';
  h+='<div class="kpis"><div class="kpi dark rise">'+ICON.cal+'<b>'+st.n+'</b><span>entraînements</span></div><div class="kpi rise">'+ICON.weight+'<b>'+fmtVol(st.vol)+'</b><span>volume total soulevé</span></div>'+
    '<div class="kpi rise">'+ICON.layers+'<b>'+fmtN(st.sets)+'</b><span>séries réalisées</span></div><div class="kpi rise">'+ICON.clock+'<b>'+fmtHM(st.ms)+'</b><span>passées à s’entraîner</span></div></div>';
  h+='<div class="duo"><div class="stack">';
  h+='<div class="card"><div class="card-h"><b>Volume par semaine</b><span>8 semaines</span></div><div class="chart">'+barChart(weeksData(sessVol),function(v){return v>=1000?fmt(v/1000)+'t':fmt(v)},'Volume soulevé par semaine')+'</div></div>';
  h+='<div class="card"><div class="card-h"><b>Séances par semaine</b><span>objectif '+(S.settings.goal||3)+'</span></div><div class="chart">'+barChart(weeksData(function(){return 1}),function(v){return v},'Séances par semaine')+'</div></div>';
  h+='</div><div class="stack">'+streakCard();
  var counts={};S.sessions.forEach(function(s){s.exs.forEach(function(e){counts[e.ex]=(counts[e.ex]||0)+1})});
  var ids=Object.keys(counts).filter(function(id){return counts[id]>=2}).sort(function(a,b){return counts[b]-counts[a]}).slice(0,5);
  if(ids.length){
    h+='<div class="card"><div class="card-h"><b>Progression des charges</b><span>1RM estimé</span></div><div>';
    ids.forEach(function(id){var sr=series(id),f=sr[0].e1,l=sr[sr.length-1].e1,dl=l-f;
      h+='<button class="trend" data-act="progex" data-ex="'+esc(id)+'"><span><b>'+esc(exInfo(id).name)+'</b><small>'+fmt(l)+' kg · '+sr.length+' séances</small></span>'+spark(sr.map(function(p){return p.e1}))+'<span class="delta'+(dl>0?'':' neg')+'">'+(dl>0?'+':'')+fmt(dl)+' kg</span></button>'});
    h+='</div></div>';
  }
  var rec=topRecords().slice(0,6);
  if(rec.length){
    h+='<div class="card"><div class="card-h"><b>Records personnels</b><span>meilleure série</span></div><div>';
    rec.forEach(function(x,k){h+='<button class="recrow" data-act="progex" data-ex="'+esc(x.ex)+'"><span class="rk">'+(k+1)+'</span><span><b>'+esc(exInfo(x.ex).name)+'</b><small>'+fmt(x.kg)+' kg × '+x.reps+' · '+esc(dfmt(x.t,{day:'numeric',month:'short'}))+'</small></span><span class="rv">'+fmt(x.e1)+' kg</span></button>'});
    h+='</div></div>';
  }
  return h+'</div></div></div>';
}
function viewSuivi(){
  var subs=[['apercu','Aperçu'],['courbes','Courbes'],['histo','Historique'],['volume','Volume'],['corps','Corps']];
  if(!ui.sub||!subs.some(function(x){return x[0]===ui.sub}))ui.sub='apercu';
  var t='<div class="fchips" role="group" aria-label="Affichage">'+subs.map(function(x){return '<button class="fchip" data-act="sub" data-s="'+x[0]+'" aria-pressed="'+(ui.sub===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  var body=ui.sub==='histo'?viewHisto():ui.sub==='volume'?viewVolume():ui.sub==='corps'?viewBody():ui.sub==='courbes'?viewProg():viewApercu();
  return '<div class="stack">'+t+body+'</div>';
}

/* ---- Profil ---- */
function viewProfil(){
  var subs=[['resume','Résumé'],['trophees','Trophées'],['reglages','Réglages']];
  if(S.rpg.on)subs.unshift(['aventure','Aventure']);
  else if(ui.ps==='aventure')ui.ps='resume';
  var st=allStats(),sk=streakInfo(),nm=(S.profile.name||'').trim()||firstName()||'Athlète',sub='';
  try{if(typeof auth!=='undefined'&&auth.currentUser)sub=auth.currentUser.email||''}catch(e){}
  if(S.rpg.on){var lv=rpgLevel(rpgXP());sub='Niveau '+lv+' · '+rpgTitle(lv)}
  var bn=S.profile.banner;
  var h='<div class="stack"><div class="pcover rise">'+(bn?'<span class="ph fill pc-banner" aria-hidden="true" style="background-image:url('+bn+')"></span>':phHtml('accueil','fill'))+
    '<button class="cover-edit" data-act="banneredit" aria-label="Modifier la bannière">'+ICON.edit+'</button>'+
    '<input id="photof" type="file" accept="image/*" hidden><input id="bannerf" type="file" accept="image/*" hidden>'+
    '<div class="pcover-in"><span class="av-wrap"><span class="bigav" id="bigav">'+avatarHtml()+'</span><button class="av-edit" data-act="photoedit" aria-label="'+(S.profile.photo?'Modifier la photo de profil':'Ajouter une photo de profil')+'">'+ICON.edit+'</button></span><h2>'+esc(nm)+'</h2><p>'+esc(sub)+'</p>'+
    '<div class="pstats"><div><b>'+st.n+'</b><span>séances</span></div><div><b>'+fmtVol(st.vol)+'</b><span>soulevés</span></div><div><b>'+sk.best+'</b><span>sem. record</span></div></div></div></div>';
  h+='<div class="seg '+(subs.length===4?'four':'three')+'" role="group" aria-label="Profil">'+subs.map(function(x){return '<button data-act="ps" data-s="'+x[0]+'" aria-pressed="'+(ui.ps===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+=ui.ps==='aventure'?viewAventure():ui.ps==='trophees'?viewTroph():ui.ps==='reglages'?viewReglages():viewResume();
  h+='<h2 class="h">Mes espaces</h2><div class="navlist">'+
    '<button class="navrow" data-act="goto" data-tab="onboard"><span class="ib">'+PERSON+'</span><span>Informations personnelles<small>Prénom, taille, poids, âge, sexe</small></span><span class="chev">'+ICON.chevR+'</span></button>'+
    '<button class="navrow" data-act="goto" data-tab="suivi" data-s="corps"><span class="ib">'+ICON.ruler+'</span><span>Corps<small>Poids et mensurations</small></span><span class="chev">'+ICON.chevR+'</span></button>'+
    '<button class="navrow" data-act="goto" data-tab="progs" data-s="anat"><span class="ib">'+PERSON+'</span><span>Anatomie<small>Muscles, rôle et conseils de recrutement</small></span><span class="chev">'+ICON.chevR+'</span></button></div>';
  return h+'</div>';
}

/* ---------- Écouteurs ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='sheet'){closeSheet();return}
  var b=t.closest('[data-act],[data-tab]');
  if(!b)return;
  if(b.dataset.tab){
    if(ui.tab!==b.dataset.tab)ui.prev=ui.tab;
    if(b.classList.contains('tab')&&ui.tab===b.dataset.tab&&ui.tab==='progs'&&ui.edit&&!S.active){ui.edit=null}
    ui.tab=b.dataset.tab;
    render();$('#view').scrollTop=0;return}
  if(!guestAllowed(b.dataset.act,b))e.preventDefault();
  act(b.dataset.act,b);
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='cal')ui.calOpen=e.target.open},true);
document.addEventListener('input',function(e){
  var t=e.target;
  if(GUEST&&!GUEST_INPUTS.test(t.id))return;
  if(t.id==='wname'&&S.active){S.active.name=t.value;save();return}
  if(t.id==='acc-pick'){applyAccent(t.value);var an=$('#acc-name');if(an)an.textContent=accName(t.value.toLowerCase());return}
  if(t.id==='pq'){ui.pickQ=t.value;drawPick();return}
  if(/^cal-(age|h|kg)$/.test(t.id)){var ci=calState();ci[t.id.slice(4)]=t.value;return}
  if(t.id==='hvma'){ui.vma=t.value;if(!GUEST){var vv=parseFloat(String(t.value).replace(',','.'));S.hy.vma=vv>=6&&vv<=30?vv:'';save()}var hr=$('#hv-res');if(hr)hr.innerHTML=hVmaRes();return}
  if(t.id==='exq'){ui.exQ=t.value;var xl=$('#exlist');if(xl)xl.innerHTML=exListHtml();return}
  if(t.id==='pname'){S.profile.name=t.value;save();updateProf();var ba=$('#bigav');if(ba)ba.innerHTML=avatarHtml();return}
  if(t.id==='pw'){drawPlates();return}
  if(t.id==='ww'){drawWarm();return}
  if(t.id==='rn'&&ui.edit){ui.edit.name=t.value;return}
  if(t.dataset&&t.dataset.e&&ui.edit){var n=parseInt(t.value,10);ui.edit.items[+t.dataset.i][t.dataset.e]=isNaN(n)?'':n;return}
  if(t.dataset&&t.dataset.f&&S.active){
    var v=parseFloat(String(t.value).replace(',','.'));
    S.active.exs[+t.dataset.i].sets[+t.dataset.j][t.dataset.f]=isNaN(v)?'':v;save();
  }
});
document.addEventListener('change',function(e){
  if(GUEST&&!GUEST_INPUTS.test(e.target.id))return;
  if(e.target.id==='acc-pick'){setAccent(e.target.value);render();return}
  if(e.target.id==='bgfile'&&e.target.files&&e.target.files[0]){setBgFile(e.target.files[0]);return}
  if(/^cal-(f|act|obj)$/.test(e.target.id)){var cg=calState();cg[e.target.id.slice(4)]=e.target.value;if(cg.mb)calRun(cg.td?2:1);return}
  if(e.target.id==='pex'){ui.progEx=e.target.value;render()}
  if(e.target.id==='bm'){ui.bm=e.target.value;render()}
  if(e.target.id==='photof'&&e.target.files&&e.target.files[0]){closeSheet();setPhoto(e.target.files[0])}
  if(e.target.id==='bannerf'&&e.target.files&&e.target.files[0])setBanner(e.target.files[0]);
  if(/^pl-[0-6]$/.test(e.target.id)){S.plan[+e.target.id.slice(3)]=e.target.value;save();render()}
});
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='onb'){e.preventDefault();if(GUEST){guestBlock();return}saveOnboard()}});
document.addEventListener('focusin',function(e){var t=e.target;if(GUEST&&t&&t.readOnly&&t.getAttribute('aria-readonly')==='true'&&!$('#sheet').querySelector('[data-act="guestexit"]'))guestBlock()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
/* Muscles du schéma (éléments SVG) : activables au clavier comme des boutons */
document.addEventListener('keydown',function(e){var g=e.target.closest&&e.target.closest('.mz');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectMuscle(g.dataset.m)}});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){pushRemote()}
  else{keepAwake();tickClock()}
});

render();
if(S.active)keepAwake();
})();
</script>
</body></html>
